name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.2. Leave empty to use the current ref name."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.1.0"

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          input_tag="${{ github.event.inputs.tag }}"
          if [ -n "$input_tag" ]; then
            tag_name="$input_tag"
          else
            tag_name="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$tag_name" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Release tag must look like v1.2 or v1.2.3. Got: $tag_name"
            exit 1
          fi

          version_name="$(grep -E 'versionName[[:space:]]*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')"
          version_code="$(grep -E 'versionCode[[:space:]]*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*=[[:space:]]*([0-9]+).*/\1/')"
          expected_tag="v${version_name}"

          if [ "$tag_name" != "$expected_tag" ]; then
            echo "::error::Tag $tag_name does not match app versionName $version_name. Expected $expected_tag."
            exit 1
          fi

          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Prepare release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SMART_REIMBURSE_SYNC_API_URL: ${{ secrets.SMART_REIMBURSE_SYNC_API_URL }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD SMART_REIMBURSE_SYNC_API_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required signing secret: $name"
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/smart-reimburse-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/smart-reimburse-signing/release.jks"
          chmod 600 "$RUNNER_TEMP/smart-reimburse-signing/release.jks"

      - name: Test, lint, and build signed release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/smart-reimburse-signing/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SMART_REIMBURSE_SYNC_API_URL: ${{ secrets.SMART_REIMBURSE_SYNC_API_URL }}
        run: |
          chmod +x ./gradlew
          ./gradlew clean :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease --no-daemon -Dkotlin.compiler.execution.strategy=in-process

      - name: Verify APK signature
        run: apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Run database migration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon

      - name: Prepare release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail

          tag_name="${{ steps.release.outputs.tag_name }}"
          version_name="${{ steps.release.outputs.version_name }}"
          version_code="${{ steps.release.outputs.version_code }}"
          apk_name="SmartReimburse-${tag_name}-release.apk"
          aab_name="SmartReimburse-${tag_name}-release.aab"

          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/${apk_name}"
          cp app/build/outputs/bundle/release/app-release.aab "release-artifacts/${aab_name}"
          sha256sum "release-artifacts/${apk_name}" "release-artifacts/${aab_name}" > "release-artifacts/SHA256SUMS.txt"

          cat > release-notes.md <<EOF
          ## SmartReimburse ${tag_name}

          - Auto-built by GitHub Actions.
          - Commit: ${GITHUB_SHA}
          - Android versionName: ${version_name}
          - Android versionCode: ${version_code}
          EOF

          echo "apk_path=release-artifacts/${apk_name}" >> "$GITHUB_OUTPUT"
          echo "aab_path=release-artifacts/${aab_name}" >> "$GITHUB_OUTPUT"
          echo "sha_path=release-artifacts/SHA256SUMS.txt" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag_name="${{ steps.release.outputs.tag_name }}"
          title="SmartReimburse ${tag_name}"
          apk_path="${{ steps.assets.outputs.apk_path }}"
          aab_path="${{ steps.assets.outputs.aab_path }}"
          sha_path="${{ steps.assets.outputs.sha_path }}"

          if gh release view "$tag_name" >/dev/null 2>&1; then
            gh release edit "$tag_name" \
              --title "$title" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "$tag_name" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file release-notes.md \
              --latest
          fi

          gh release upload "$tag_name" "$apk_path" "$aab_path" "$sha_path" --clobber
